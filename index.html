<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a8f9e">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Bubble Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Righteous&family=Baloo+2:wght@800&family=Patrick+Hand&family=Grandstander:wght@800&family=Dela+Gothic+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen game. A slim HUD in the chosen world's type and color, the tall board scaled to fit, a world picker over the board.
   Each world is its own single visual look, so tokens are swapped per world by script instead of by light/dark theme. */
:root{
  --page:#fde6ec; --ink:#5a3a2e; --muted:#9a7064; --title:#d9536f; --title-shadow:none;
  --chip:#ffffff; --edge:#f3c7cf; --accent:#e8607e; --accent-ink:#ffffff;
  --display:"Mochiy Pop One","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--page); color:var(--ink); font-family:var(--body); overflow:hidden; overscroll-behavior:none; transition:background-color .3s;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; touch-action:manipulation}
.app{box-sizing:border-box; height:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:10px; padding-inline:16px; padding-block:12px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px}
h1{font-family:var(--display); font-weight:800; font-size:1.55rem; line-height:1.1; margin:0; color:var(--title); text-shadow:var(--title-shadow)}
.stats{display:flex; gap:6px}
.chip{display:flex; flex-direction:column; align-items:center; min-width:52px; background:var(--chip); border:2px solid var(--edge); border-radius:14px; padding:3px 10px}
.chip span{font-size:.6rem; font-weight:900; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.chip b{font-family:var(--body); font-weight:900; font-size:1.02rem; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:6px; flex-wrap:wrap}
.tool{font:800 .78rem var(--body); color:var(--ink); background:var(--chip); border:2px solid var(--edge); border-radius:999px; padding:6px 12px; cursor:pointer}
.tool:hover{border-color:var(--accent)}
.chip.combo.hot{border-color:var(--accent)}
.chip.combo.hot b{color:var(--accent)}
.meter{display:block; width:100%; height:4px; margin-top:2px; border-radius:2px; overflow:hidden; background:color-mix(in srgb, var(--edge) 60%, transparent)}
.meter i{display:block; height:100%; width:0; border-radius:2px; background:var(--accent); transition:width .25s}
.chip.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.15)}}
.tool.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.world .wnow{font-size:.62rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--wtitle)}
.tool:focus-visible,.btn:focus-visible,.world:focus-visible,canvas:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
.frame{position:relative; border-radius:24px; box-shadow:0 0 0 3px var(--edge), 0 16px 30px -14px rgba(40,30,30,.35)}
canvas#game{display:block; border-radius:24px; touch-action:none; cursor:crosshair}
.overlay{position:absolute; inset:0; display:grid; place-items:center; padding:14px; border-radius:24px; overflow:auto;
  background:color-mix(in srgb, var(--page) 70%, transparent); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
.card{box-sizing:border-box; width:100%; max-width:360px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;
  background:var(--chip); border:3px solid var(--edge); border-radius:22px; padding:18px 16px; animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.card h2{font-family:var(--display); font-weight:800; font-size:1.5rem; margin:0; color:var(--accent); text-wrap:balance}
.card p{margin:0; line-height:1.45; font-weight:700; font-size:.9rem}
.card .big{font-family:var(--display); font-size:2.1rem; font-variant-numeric:tabular-nums}
.row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.btn{font:900 1rem var(--body); color:var(--accent-ink); background:var(--accent); border:0; border-radius:999px; padding:10px 22px; cursor:pointer;
  box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 60%, #000)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--edge)}
.btn:active{transform:translateY(2px)}
.worlds{display:flex; flex-direction:column; gap:7px; width:100%}
.world{display:grid; grid-template-columns:96px minmax(0,1fr); grid-template-rows:auto; column-gap:10px; row-gap:1px; align-items:center;
  text-align:left; cursor:pointer; padding:7px; border-radius:16px;
  background:var(--wbg); border:2.5px solid var(--wedge); color:var(--wink); font-family:var(--body)}
.world > span{grid-column:2; min-width:0}
.world:hover{transform:translateY(-2px)}
.world canvas{grid-column:1; grid-row:1 / span 4; width:96px; height:46px; border-radius:10px; display:block}
.world .wname{font-family:var(--wfont); font-size:1rem; color:var(--wtitle); line-height:1.2}
.world .wtwist{font-size:.72rem; font-weight:800; opacity:.85}
.world .wbest{font-size:.66rem; font-weight:800; opacity:.7}
.menu-title{font-family:var(--display); font-weight:800; font-size:2.1rem; line-height:1.1; margin:0; color:var(--title); text-shadow:var(--title-shadow); text-wrap:balance}
.menu-buttons{display:flex; flex-direction:column; gap:10px; width:100%; max-width:240px}
.btn.big{font-size:1.15rem; padding:12px 22px; width:100%}
.btn.small{font-size:.85rem; padding:7px 14px; min-width:84px}
.btn:disabled{opacity:.45; cursor:default; transform:none}
.slots{display:flex; flex-direction:column; gap:8px; width:100%}
.slot{display:flex; align-items:stretch; gap:6px; width:100%}
.slot-main{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:9px 12px; border-radius:14px;
  border:2.5px solid var(--edge); background:var(--page); color:var(--ink); font-family:var(--body); cursor:pointer}
.slot-main:hover:not(:disabled){border-color:var(--accent)}
.slot-main:disabled{cursor:default; border-style:dashed; background:transparent}
.slot-n{font-size:.62rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.slot-w{font-size:1.05rem; line-height:1.2}
.slot-d{font-size:.76rem; font-weight:700; font-variant-numeric:tabular-nums}
.slot-del{font:800 .74rem var(--body); border:2px solid var(--edge); background:transparent; color:var(--ink); border-radius:12px; padding:0 10px; cursor:pointer}
.slot-del.armed{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.set-rows{display:flex; flex-direction:column; width:100%}
.set-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 2px; border-bottom:1.5px dashed var(--edge); text-align:left}
.set-row span{font-weight:800}
.set-row small{display:block; font-weight:700; font-size:.72rem; color:var(--muted)}
.hint{margin:0; text-align:center; font-size:.74rem; font-weight:800; color:var(--muted)}
.tips{font-size:.78rem !important; color:var(--muted); max-width:30ch}
@keyframes pop{from{transform:scale(.8); opacity:0} to{transform:scale(1); opacity:1}}
/* Phone layouts are switched on by script from the real screen size (html.phone-ui / html.phone-land),
   so they still apply when a phone browser lays the page out at desktop width ("Desktop site" mode). */
/* Phones: title and buttons share the top row, score chips fill the second row, the board takes the rest. */
html.phone-ui .app{gap:6px; padding-block:8px; max-width:none}
html.phone-ui header{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 8px}
html.phone-ui h1{grid-column:1; grid-row:1; font-size:1.3rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
html.phone-ui .tools{grid-column:2; grid-row:1; flex-wrap:nowrap}
html.phone-ui .tool{padding:7px 11px; font-size:.8rem}
html.phone-ui .stats{grid-column:1 / -1; grid-row:2; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px}
html.phone-ui .chip{min-width:0; padding:2px 4px; border-radius:12px}
html.phone-ui .chip b{font-size:.95rem}
html.phone-ui .frame, html.phone-ui canvas#game, html.phone-ui .overlay{border-radius:18px}
html.phone-ui .overlay{padding:10px}
html.phone-ui .card{padding:16px 12px; gap:8px}
html.phone-ui .hint, html.short-ui .hint{display:none}
/* Phones held sideways: header becomes a narrow side column so the board gets the full height. */
html.phone-land .app{max-width:none; flex-direction:row; align-items:stretch; gap:12px; padding-block:8px}
html.phone-land header{display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:8px; width:200px; flex:none}
html.phone-land h1{font-size:1.2rem; white-space:normal}
html.phone-land .stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px}
html.phone-land .tools{flex-direction:column; flex-wrap:nowrap}
html.phone-land .tool{text-align:center}
html.phone-land .stage{min-width:0}
html.phone-land .card h2, html.phone-land .menu-title{font-size:1.25rem}
html.phone-land .card{gap:6px; padding:12px 10px}
html.phone-land .btn.big{font-size:1rem; padding:9px 18px}
html.phone-land .hint{display:none}
/* Landing page (main menu): a layered sky in the five worlds' colors with one hot-air balloon per world.
   Sky: Sushi slate into Under the Sea blue. Hills: Garden Pond green, Paper Craft tan, Mochi rose. Play: Sushi salmon. */
.landing{position:fixed; inset:0; z-index:50; overflow:hidden; display:flex; flex-direction:column; color:#24324a; font-family:var(--body);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(180deg, #7a8f9e 0%, #9fc3dc 26%, #cfe9fb 52%, #e9f4fb 66%);
  --page:#f3f7fb; --ink:#24324a; --muted:#5d6b80; --title:#24324a; --title-shadow:none; --chip:#ffffff;
  --edge:#c9d4e0; --accent:#ff8a5c; --accent-ink:#24324a; --display:"Righteous","Nunito",ui-rounded,sans-serif}
.ld-balloon{position:absolute; animation:ld-float var(--d,7s) ease-in-out var(--dl,0s) infinite}
.ld-balloon svg{display:block; width:100%; height:100%}
@keyframes ld-float{0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-12px) rotate(1.5deg)}}
.ld-hills{position:absolute; left:0; bottom:0; width:100%; height:46%}
.ld-inner{position:relative; flex:1; min-height:0; width:100%; max-width:440px; margin:0 auto; box-sizing:border-box; padding:64px 24px 26px; display:flex; flex-direction:column; gap:12px}
.ld-head{text-align:center; display:flex; flex-direction:column; gap:8px}
.ld-title{position:relative; z-index:1; margin:0; font-family:"Righteous","Nunito",sans-serif; font-weight:400; font-size:50px; line-height:1; color:#ffffff;
  text-shadow:0 2px 12px rgba(36,50,74,.35); text-wrap:balance}
.ld-sub{position:relative; z-index:1; margin:0; font-size:15px; font-weight:800; color:#24324a; text-shadow:0 1px 6px rgba(255,255,255,.5)}
.ld-sky{position:relative; flex:1; min-height:70px; overflow:hidden}
.ld-panel{display:flex; flex-direction:column; gap:12px}
.ld-btn{width:100%; height:56px; border-radius:999px; border:1.5px solid rgba(36,50,74,.25); background:rgba(255,255,255,.72); color:#24324a;
  font:900 18px var(--body); cursor:pointer; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
.ld-btn:hover{background:rgba(255,255,255,.9)}
.ld-btn.primary{height:60px; border:0; background:#ff8a5c; color:#24324a; font-family:"Righteous","Nunito",sans-serif; font-weight:400; font-size:24px;
  box-shadow:0 8px 22px -8px rgba(208,88,44,.8)}
.ld-btn.primary:hover{background:#ff9d76}
.ld-btn:focus-visible{outline:3px solid #24324a; outline-offset:3px}
.ld-foot{margin:2px 0 0; text-align:center; font-size:12px; font-weight:800; color:#4a3040}
.ld-tip{margin:0; text-align:center; font-size:11px; font-weight:700; color:#5a3a48}
.ld-card{display:flex; flex-direction:column; gap:10px; padding:18px 16px; border-radius:24px; background:rgba(255,255,255,.88); border:1px solid rgba(36,50,74,.15);
  box-shadow:0 14px 34px -18px rgba(36,50,74,.5); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:#24324a}
.ld-card h3{margin:0; text-align:center; font-family:"Righteous","Nunito",sans-serif; font-weight:400; font-size:28px; color:#24324a}
.ld-card p{margin:0; text-align:center; font-size:14px; font-weight:700; line-height:1.45; color:#3d4b60}
.ld-card .row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.ld-card .btn{color:#24324a}
html.phone-land .ld-inner{max-width:none; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,340px); grid-template-rows:auto minmax(0,1fr); column-gap:28px; row-gap:8px; padding:20px 28px; align-items:stretch}
html.phone-land .ld-head{grid-column:1; grid-row:1}
html.phone-land .ld-sky{grid-column:1; grid-row:2; min-height:0}
html.phone-land .ld-panel{grid-column:2; grid-row:1 / span 2; align-self:center}
html.phone-land .ld-title{font-size:40px}
/* Coins and the World Shop. */
.coin{display:inline-block; flex:none; width:1.1em; height:1.1em; border-radius:50%; vertical-align:-.18em;
  background:radial-gradient(circle at 35% 30%, #fff1a8, #ffc93c 55%, #e09d1a); box-shadow:inset 0 0 0 .12em #e8a91e}
.coin.dim{background:#cfd6de; box-shadow:none}
.chip.coins b{display:flex; align-items:center; gap:4px}
.chip.coins b::before{content:""; width:.8em; height:.8em; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1a8, #ffc93c 55%, #e09d1a); box-shadow:inset 0 0 0 .1em #e8a91e}
.ld-coins{position:absolute; z-index:2; top:calc(env(safe-area-inset-top, 0px) + 14px); right:16px; display:flex; align-items:center; gap:7px;
  background:rgba(255,255,255,.85); border-radius:999px; padding:6px 14px 6px 8px; font-weight:900; font-size:15px; color:#24324a; font-variant-numeric:tabular-nums}
.ld-btn.shop{display:flex; align-items:center; justify-content:center; gap:10px; border:2px solid #e8a91e; background:#fff6d6}
.ld-btn.shop:hover{background:#fff0c2}
.ld-tag{background:#24324a; color:#ffffff; font-size:11px; font-weight:900; border-radius:999px; padding:3px 9px}
.ld-fade{position:absolute; inset:0; display:none; background:rgba(240,245,250,.62); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.landing.fade .ld-fade{display:block}
.landing.page .ld-head, .landing.page .ld-sky, .landing.page .ld-coins{display:none}
.landing.page .ld-inner{padding:14px 14px 18px; max-width:480px}
.landing.page .ld-panel{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain}
html.phone-land .landing.page .ld-inner{display:flex; flex-direction:column; max-width:520px; padding:12px 16px}
.pick-card{margin-block:auto; background:#ffffff; border:1px solid rgba(36,50,74,.18); box-shadow:0 22px 48px -18px rgba(36,50,74,.55), 0 2px 6px rgba(36,50,74,.08)}
.pick-card .worlds{width:100%}
.pick-note{font-size:12px !important; color:#5d6b80 !important}
.world{grid-template-columns:96px minmax(0,1fr) auto}
.world > span.wlock{grid-column:3; grid-row:1 / span 4; display:flex; flex-direction:column; align-items:center; gap:2px; padding:0 4px; font-size:10.5px; font-weight:900; color:#5d6b80; text-align:center}
.world.locked canvas{filter:grayscale(1); opacity:.55}
.wnew{display:inline-block; vertical-align:2px; background:#ff8a5c; color:#ffffff; font-family:var(--body); font-size:9.5px; font-weight:900; letter-spacing:.08em; border-radius:999px; padding:1px 7px}
.shop{display:flex; flex-direction:column; gap:10px; color:#24324a}
.shop-top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.shop-back{display:flex; align-items:center; gap:4px; height:38px; padding:0 14px 0 10px; border:0; border-radius:999px; background:rgba(255,255,255,.85); color:#24324a; font:900 14px var(--body); cursor:pointer}
.shop-back:focus-visible, .shop-buy:focus-visible{outline:3px solid #24324a; outline-offset:2px}
.coin-pill{display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.85); border-radius:999px; padding:6px 14px 6px 8px; font-weight:900; font-size:15px; font-variant-numeric:tabular-nums}
.shop-title{margin:4px 0 0; text-align:center; font-family:"Righteous","Nunito",sans-serif; font-weight:400; font-size:38px; line-height:1; color:#ffffff; text-shadow:0 2px 12px rgba(36,50,74,.35)}
.shop-sub{margin:0; text-align:center; font-size:14px; font-weight:800}
.shop-note{margin:0; text-align:center; font-size:13px; font-weight:900; color:#2f7a52; background:#e3f4ea; border-radius:12px; padding:8px 10px}
.shop-list{display:flex; flex-direction:column; gap:8px}
.shop-card{display:grid; grid-template-columns:92px minmax(0,1fr) auto; align-items:center; gap:10px; padding:9px 10px; border-radius:18px; background:rgba(255,255,255,.92); box-shadow:0 8px 20px -14px rgba(36,50,74,.6)}
.shop-prev{position:relative; display:block; height:32px; border-radius:10px; overflow:hidden}
.shop-prev canvas{display:block; width:100%; height:100%}
.shop-card.locked .shop-prev canvas{filter:grayscale(.85) opacity(.7)}
.shop-lock{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ffffff; background:rgba(36,50,74,.35)}
.shop-text{display:flex; flex-direction:column; gap:2px; min-width:0}
.shop-name{font-size:16px; line-height:1.15}
.shop-tag{font-size:11.5px; font-weight:700; color:#5d6b80}
.shop-act{display:flex; flex-direction:column; align-items:flex-end}
.shop-owned{display:flex; align-items:center; gap:4px; padding:6px 11px; border-radius:999px; background:#e3f4ea; color:#2f7a52; font-size:12px; font-weight:900}
.shop-buy{display:flex; align-items:center; gap:6px; height:38px; padding:0 14px 0 10px; border:0; border-radius:999px; background:#ff8a5c; color:#24324a; font:900 15px var(--body); cursor:pointer; box-shadow:0 4px 0 #d0582c; font-variant-numeric:tabular-nums}
.shop-buy:active{transform:translateY(2px); box-shadow:0 2px 0 #d0582c}
.shop-buy:disabled{background:#f1f4f7; color:#8592a5; box-shadow:none; border:1.5px solid #c9d4e0; cursor:default; transform:none}
.shop-need{display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.shop-need small{font-size:10.5px; font-weight:800; color:#6b7789; white-space:nowrap}
.shop-earn{display:flex; flex-direction:column; gap:5px; padding:12px 14px; border-radius:18px; background:rgba(255,255,255,.9)}
.shop-earn span{font-size:11px; font-weight:900; letter-spacing:.1em; color:#5d6b80}
.shop-earn b{font-size:13px; font-weight:800}
.ld-modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(36,50,74,.42)}
.ld-modal[hidden]{display:none}
.ld-modal-card{width:100%; max-width:340px; max-height:100%; overflow-x:hidden; overflow-y:auto; box-sizing:border-box; padding:0 20px 20px; border-radius:28px; background:#ffffff; color:#24324a;
  box-shadow:0 24px 50px -20px rgba(20,30,50,.7); display:flex; flex-direction:column; align-items:center; gap:10px}
.cf-prev{position:relative; display:block; align-self:stretch; margin:0 -20px; height:110px; overflow:hidden}
.cf-prev canvas{display:block; width:100%; height:100%}
.cf-name{position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:24px; color:#ffffff; text-shadow:0 2px 8px rgba(0,0,0,.45)}
.ld-modal-card h3{text-align:center; line-height:1.15; margin:4px 0 0; font-family:"Righteous","Nunito",sans-serif; font-weight:400; font-size:26px}
.ld-modal-card p{margin:0; text-align:center; font-size:14px; font-weight:700; line-height:1.45; color:#3d4b60}
.cf-cost{display:flex; align-items:center; gap:16px; padding:10px 16px; border-radius:16px; background:#f3f7fb; font-variant-numeric:tabular-nums}
.cf-cost span{display:flex; flex-direction:column; align-items:center}
.cf-cost small{font-size:10px; font-weight:900; letter-spacing:.1em; color:#5d6b80}
.cf-cost b{font-size:17px; font-weight:900}
html.tight-ui .ld-inner{padding-top:44px}
html.tight-ui .ld-title{font-size:42px}
html.tight-ui .ld-btn{height:48px; font-size:17px}
html.tight-ui .ld-btn.primary{height:52px; font-size:22px}
html.tight-ui .ld-panel{gap:9px}
html.tight-ui .ld-tip{display:none}
@media (prefers-reduced-motion: reduce){ .ld-balloon{animation:none} }
@media (prefers-reduced-motion: reduce){ .card{animation:none} .world:hover{transform:none} }

        if (ns.length){ const [a, b] = ns[rnd(ns.length)], u = grid[a][b]; grid[a][b] = v; row[c] = u; v.jg = { t:clock, x:0, y:-1 }; u.jg = { t:clock, x:0, y:-1 }; }

function swap(){

function hits(x, y){
  if (y - R <= TOP + ceilOff) return true;
  const lim = (2*R - 6) ** 2;
  for (let r = 0; r < grid.length; r++){
    const yy = cellY(r);
    if (Math.abs(yy - y) > 2*R) continue;
    for (let c = 0; c < COLS; c++){
      if (!grid[r][c]) continue;
      const dx = cellX(r, c) - x, dy = yy - y;
      if (dx*dx + dy*dy < lim) return true;
    }
  }
  return false;
}
function flood(r, c, test){
  const seen = new Set([r*COLS + c]), out = [[r, c]], q = [[r, c]];
  while (q.length){
    const [a, b] = q.pop();
    for (const [nr, nc] of neighbors(a, b)){
      const k = nr*COLS + nc;
      if (seen.has(k) || !get(nr, nc) || !test(nr, nc)) continue;
      seen.add(k); out.push([nr, nc]); q.push([nr, nc]);
    }
  }
  return out;
}
function floating(){
  const seen = new Set(), q = [];
  if (grid[0]) grid[0].forEach((v, c) => { if (v){ seen.add(c); q.push([0, c]); } });
  while (q.length){
    const [a, b] = q.pop();
    for (const [nr, nc] of neighbors(a, b)){
      const k = nr*COLS + nc;
      if (seen.has(k) || !get(nr, nc)) continue;
      seen.add(k); q.push([nr, nc]);
    }
  }
  const out = [];
  grid.forEach((row, r) => row.forEach((v, c) => { if (v && !seen.has(r*COLS + c)) out.push([r, c]); }));
  return out;
}
// Each world pops into its own pieces.
const FX = {
  mochi: { kind:'crumb', cols:['#c98b5e', '#f3e3d8', '#e8c39e'] },
  sea:   { kind:'drop', cols:['#bfe4fb', '#ffffff', '#7cc8ff'] },
  paper: { kind:'confetti', cols:['#e98a6a', '#6aa6c9', '#f2c75c', '#8fb07a', '#c98fb8'] },
  pond:  { kind:'petal', cols:['#ffb6d1', '#ffffff', '#ffd76b'] },
  sushi: { kind:'rice', cols:['#fffaf0', '#ffffff', '#fff3e0'] }
};
function themedBurst(x, y, color){
  const fx = FX[worldId] || FX.mochi, n = reduceMotion ? 4 : 10;
  for (let i = 0; i < n; i++){
    const a = Math.random()*TAU, sp = 90 + Math.random()*200;
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 90, life:1, kind:fx.kind,
      col: Math.random() < .45 ? color : fx.cols[rnd(fx.cols.length)], size:3.5 + Math.random()*3, rot:Math.random()*TAU, vr:(Math.random() - .5)*14 });
  }
}
function burst(x, y, n, hearts, color){
  n = reduceMotion ? Math.ceil(n/3) : n;
  for (let i = 0; i < n; i++){
    const a = Math.random()*TAU, sp = 60 + Math.random()*220;
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60, life:1,
      col: hearts ? world.parts[rnd(6)] : (Math.random() < .3 ? '#ffffff' : color),
      size: 3 + Math.random()*4, heart: hearts || Math.random() < .25 });
  }
}
function lowestY(){ return TOP + R + (grid.length - 1)*ROWH + R; }
function trim(){ while (grid.length && grid[grid.length - 1].every(v => !v)) grid.pop(); }
// Everything within two steps of the landing spot (for bombs).
function ring2(r, c){
  const seen = new Set([r*COLS + c]), out = [], q = [[r, c, 0]];
  while (q.length){
    const [a, b, d] = q.shift();
    if (d >= 2) continue;
    for (const [nr, nc] of neighbors(a, b)){
      const k = nr*COLS + nc;
      if (seen.has(k)) continue;
      seen.add(k);
      if (get(nr, nc)) out.push([nr, nc]);
      q.push([nr, nc, d + 1]);
    }
  }
  return out;
}
// A rainbow takes whichever touching color makes the biggest group.
function bestRainbowColor(r, c){
  let bestC = -1, bestN = 0;
  const cols = new Set(neighbors(r, c).map(([a, b]) => get(a, b)).filter(v => v && v.c >= 0).map(v => v.c));
  for (const col of cols){
    grid[r][c].c = col;
    const n = flood(r, c, (a, b) => grid[a][b].c === col).length;
    if (n > bestN){ bestN = n; bestC = col; }
  }
  return bestC >= 0 ? bestC : pickColor();
}
function land(){
  const s = shot; shot = null; levelShots++;
  const r0 = Math.round((s.y - TOP - R - ceilOff) / ROWH);
  let bestCell = null, bd = Infinity;
  for (let r = Math.max(0, r0 - 1); r <= r0 + 1; r++){
    for (let c = 0; c < COLS; c++){
      if (get(r, c)) continue;
      const dx = cellX(r, c) - s.x, dy = cellY(r) - s.y, d = dx*dx + dy*dy;
      if (d < bd){ bd = d; bestCell = [r, c]; }
    }
  }
  const [r, c] = bestCell;
  while (grid.length <= r) grid.push(Array(COLS).fill(null));
  const lx = cellX(r, c), ly = cellY(r);
  const removed = [];
  let base = 0, popped = false;
  const popList = (list, stagger) => list.forEach(([a, b], i) => {
    const v = grid[a][b];
    pops.push({ x:cellX(a, b), y:cellY(a), cell:v, t:-i*stagger });
    themedBurst(cellX(a, b), cellY(a), v.k === 'stone' ? '#9a948c' : world.parts[v.c]);
    tone(600 + i*70, .1, 'sine', .09, 1.6, i*stagger);
    removed.push(v); grid[a][b] = null;
  });

  if (s.kind === 'bomb'){
    const targets = ring2(r, c);
    burst(lx, ly, 26, false, '#ffb347');
    floats.push({ x:lx, y:ly - 10, text:'Boom!', t:0 });
    tone(90, .45, 'sawtooth', .12, .4);
    if (allowShake()) shake = 7;
    if (targets.length){ popList(targets, .02); base = targets.length*10; popped = true; }
  } else {
    const placed = makeCell(s.c); placed.bloom = false;
    grid[r][c] = placed;
    placed.sq = clock;
    for (const [nr, nc] of neighbors(r, c)){
      const v = get(nr, nc);
      if (v){ const dx = cellX(nr, nc) - lx, dy = cellY(nr) - ly, d = Math.hypot(dx, dy) || 1; v.jg = { t:clock, x:dx/d, y:dy/d }; }
    }
    rings.push({ x:lx, y:ly, t:0 });
    if (s.kind === 'rainbow'){
      placed.c = bestRainbowColor(r, c);
      burst(lx, ly, 16, true);
      floats.push({ x:lx, y:ly - 10, text:'Rainbow!', t:0 });
      tone(990, .25, 'sine', .07, 1.5);
    }
    if (s.frost){
      for (const [nr, nc] of neighbors(r, c)){ const v = get(nr, nc); if (v && v.k !== 'stone') v.c = placed.c; }
      burst(lx, ly, 14, false, '#ffffff');
      floats.push({ x:lx, y:ly - 10, text:'Frosted!', t:0 });
      tone(880, .2, 'sine', .08, 1.5);
    }
    const group = flood(r, c, (a, b) => grid[a][b].c === placed.c);
    if (group.length >= 3){ popList(group, .035); base = group.length*10; popped = true; }
  }

  if (popped){
    const fl = floating();
    fl.forEach(([a, b]) => {
      const v = grid[a][b];
      falls.push({ x:cellX(a, b), y:cellY(a), vx:(Math.random() - .5)*120, vy:-80 - Math.random()*120, cell:v });
      removed.push(v); grid[a][b] = null;
    });
    base += fl.length*fl.length*10;
    const blooms = removed.filter(v => v.bloom).length;
    base += blooms*50;
    combo++;
    const mult = Math.min(combo, 5);
    earnCoins(removed.length * mult, lx, ly);
    let gained = base * mult;
    floats.push({ x:lx, y:ly, text:'+' + gained, t:0 });
    const quick = removed.filter(v => v.warn).length;
    if (quick){ gained += quick*20; floats.push({ x:lx, y:ly - 46, text:'Quick! +' + quick*20, t:-.15, col:'#c98a12' }); }
    if (mult >= 3){
      rings.push({ x:lx, y:ly, t:0, gold:true });
      if (allowShake()){ flashT = clock; shake = Math.max(shake, 4); }
    }
    if (mult > 1){
      floats.push({ x:lx, y:ly - 24, text:`Combo ×${mult}!`, t:-.1 });
      tone(620 + mult*90, .16, 'triangle', .08, 1.5, .1);
      bumpCombo();
    }
    if (fl.length) floats.push({ x:lx, y:ly + 24, text: fl.length >= 4 ? 'Wheee!' : 'Drop!', t:-.15 });
    if (removed.length >= 6) burst(lx, ly, 14, true);
    if (blooms){ floats.push({ x:lx, y:ly - 48, text:`Bloom! +${blooms*50}`, t:-.2 }); burst(lx, ly, 18, true); }
    if (world.twist === 'order' && order.length){
      for (const v of removed){ const o = order.find(o => o.c === v.c && o.n > 0); if (o) o.n--; }
      if (order.every(o => o.n <= 0)){
        gained += 200;
        floats.push({ x:W/2, y:DEADLINE - 40, text:'Order up! +200', t:-.2 });
        [660, 880, 990].forEach((f, i) => tone(f, .14, 'triangle', .08, 0, i*.08));
        setTimeout(() => { newOrder(); saveGame(); }, 400);
      }
    }
    score += gained;
  } else {
    if (combo >= 2) floats.push({ x:lx, y:ly + 20, text:'Combo lost', t:0 });
    combo = 0;
    tone(190, .09, 'sine', .12, .6);
  }
  // A new row drops every few shots; misses bring it sooner.
  rowIn -= popped ? 1 : 2;
  if (rowIn <= 0){ rowIn = D ? D.dropEvery : 8; addRow(); }
  trim();
  // Only rocks left: they crumble away so the level can end.
  if (grid.length && !boardColors().length){
    grid.forEach((row, r2) => row.forEach((v, c2) => { if (v) falls.push({ x:cellX(r2, c2), y:cellY(r2), vx:(Math.random() - .5)*90, vy:-60, cell:v }); }));
    grid = [];
  }
  hud();
  if (!grid.length) return levelClear();
  if (lowestY() > DEADLINE){
    if (world.twist === 'calm'){
      while (grid.length && lowestY() > DEADLINE - ROWH){
        const r2 = grid.length - 1;
        grid[r2].forEach((v, c2) => { if (v) falls.push({ x:cellX(r2, c2), y:cellY(r2), vx:(Math.random() - .5)*90, vy:-60, cell:v }); });
        grid.pop(); trim();
      }
      floats.push({ x:W/2, y:DEADLINE - 30, text:'Phew! Rows floated away', t:0 });
      tone(500, .3, 'sine', .07, .7);
      if (!grid.length || !boardColors().length){ grid = []; return levelClear(); }
    } else return gameOver();
  }
  lateTwist(r, c);
  const cs = boardColors();
  if (!cs.includes(cur.c)) cur.c = pickColor();
  if (!cs.includes(next.c)) next.c = pickColor();
  if (world.twist === 'order') order = order.filter(o => o.n <= 0 || cs.includes(o.c));
  saveGame();
}
function addRow(){
  grid.unshift(newRow(null));
  parity ^= 1; ceilOff = -ROWH;
  if (allowShake()) shake = 5;
  tone(150, .25, 'square', .04, .5);
}

// ---------- input ----------
function pt(e){ const b = canvas.getBoundingClientRect(); return { x:(e.clientX - b.left)*W/b.width, y:(e.clientY - b.top)*H/b.height }; }
function setAim(p){ const a = Math.atan2(SY - p.y, p.x - SX); aimA = Math.min(Math.PI - .12, Math.max(.12, a < -Math.PI/2 ? Math.PI : a)); }
let aiming = false;
canvas.addEventListener('pointerdown', e => {
  audio();
  if (state !== 'play') return;
  const p = pt(e);
  if (p.x >= NBOX.x && p.x <= NBOX.x + NBOX.w && p.y >= NBOX.y && p.y <= NBOX.y + NBOX.h){ swap(); return; }
  aiming = true;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  setAim(p);
});
canvas.addEventListener('pointermove', e => { if (state === 'play' && (e.pointerType === 'mouse' || aiming)) setAim(pt(e)); });
canvas.addEventListener('pointerup', e => { if (!aiming) return; aiming = false; setAim(pt(e)); fire(); });
canvas.addEventListener('pointercancel', () => { aiming = false; });
const keys = {};
addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON') return;
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); audio(); fire(); }
  if (e.key === 'x' || e.key === 's' || e.key === 'ArrowDown'){ e.preventDefault(); swap(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();

addEventListener('keyup', e => { keys[e.key] = false; });
const pauseLayer = document.getElementById('pauseLayer'), pauseCard = document.getElementById('pauseCard');

addEventListener('keydown', e => {

// ---------- update ----------
for (let i = 0; i < 14; i++) ambient.push({ x:Math.random()*W, y:TOP + Math.random()*(H - TOP), s:3 + Math.random()*7, v:18 + Math.random()*26, ph:Math.random()*TAU, rot:Math.random()*TAU });
function update(dt){
  clock += dt;
  if (keys.ArrowLeft) aimA = Math.min(Math.PI - .12, aimA + 1.6*dt);
  if (keys.ArrowRight) aimA = Math.max(.12, aimA - 1.6*dt);
  ceilOff += (0 - ceilOff) * Math.min(1, dt*9);
  if (Math.abs(ceilOff) < .05) ceilOff = 0;
  shake = Math.max(0, shake - dt*30);
  if (shot && state === 'play'){
    let dist = SPEED * dt;
    const dr = drift();
    while (dist > 0 && shot){
      const k = Math.min(R*.4, dist); dist -= k;
      shot.vx += dr * (k / SPEED) / SPEED;
      shot.x += shot.vx*k; shot.y += shot.vy*k;
      if (shot.x < R){ shot.x = 2*R - shot.x; shot.vx = Math.abs(shot.vx); tone(900, .03, 'sine', .03); }
      if (shot.x > W - R){ shot.x = 2*(W - R) - shot.x; shot.vx = -Math.abs(shot.vx); tone(900, .03, 'sine', .03); }
      if (hits(shot.x, shot.y)) land();
    }
  }
  for (let i = pops.length - 1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t > .3) pops.splice(i, 1); }
  for (let i = falls.length - 1; i >= 0; i--){
    const f = falls[i];
    if (f.vr == null){ f.vr = (Math.random() - .5)*10; f.rot = 0; f.fade = 1; }
    f.vy += 1500*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.vr*dt;
    const floor = H - 24;
    if (!f.bounced && f.y > floor){ f.y = floor; f.vy = -Math.abs(f.vy)*.42; f.vx *= .7; f.vr *= .6; f.bounced = true; }
    if (f.bounced) f.fade -= dt*1.5;
    if (f.fade <= 0 || f.y > H + 2*R) falls.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.vy += 500*dt; p.x += p.vx*dt; p.y += p.vy*dt; if (p.vr) p.rot += p.vr*dt; p.life -= dt*(p.kind ? 1.35 : 1.6); if (p.life <= 0) parts.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--){ rings[i].t += dt; if (rings[i].t > .5) rings.splice(i, 1); }
  for (let i = coinFly.length - 1; i >= 0; i--){
    const c = coinFly[i]; c.t += dt;
    if (c.t >= c.dur){
      if (c.last){ bumpCoinChip(); floats.push({ x:c.tx - 6, y:c.ty + 22, text:'+' + c.amt, t:0, col:'#c98a12' }); tone(1180, .07, 'sine', .05, 1.2); }
      coinFly.splice(i, 1);
    }
  }
  for (let i = floats.length - 1; i >= 0; i--){ floats[i].t += dt; if (floats[i].t > 1.1) floats.splice(i, 1); }
  if (!reduceMotion){
    for (const a of ambient){
      if (worldId === 'sea'){ a.y -= a.v*dt; if (a.y < TOP){ a.y = DEADLINE + Math.random()*90; a.x = Math.random()*W; } }
      else if (worldId === 'sushi'){ a.y += a.v*.6*dt; a.x += Math.sin(clock + a.ph)*12*dt + 6*dt; a.rot += dt; if (a.y > DEADLINE){ a.y = TOP; a.x = Math.random()*W; } }
    }
  }
}

// ---------- draw ----------
function heart(x, y, s){
  ctx.beginPath(); ctx.moveTo(x, y + s*.3);
  ctx.bezierCurveTo(x, y, x - s*.5, y, x - s*.5, y + s*.3);
  ctx.bezierCurveTo(x - s*.5, y + s*.6, x, y + s*.8, x, y + s);
  ctx.bezierCurveTo(x, y + s*.8, x + s*.5, y + s*.6, x + s*.5, y + s*.3);
  ctx.bezierCurveTo(x + s*.5, y, x, y, x, y + s*.3);
  ctx.fill();
}
function blitCell(cell, x, y, s = 1, a = 1, special){
  const img = cell.k === 'stone' ? sprites.stone
    : cell.kind === 'bomb' ? sprites.bomb
    : cell.kind === 'rainbow' ? sprites.rainbow
    : (special != null ? special : cell.bloom) ? sprites.s[cell.c] : sprites.n[cell.c];
  if (!img) return;
  const sx = SS * (Array.isArray(s) ? s[0] : s), sy = SS * (Array.isArray(s) ? s[1] : s);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  if (cell.rot) ctx.rotate(cell.rot);
  ctx.drawImage(img, -sx/2, -sy/2, sx, sy);
  ctx.restore();
}
function aimPath(){
  let x = SX, y = SY, vx = Math.cos(aimA), vy = -Math.sin(aimA);
  const pts = [], dr = drift(); let travelled = 0;
  while (travelled < 1100){
    vx += dr * (4 / SPEED) / SPEED;
    x += vx*4; y += vy*4; travelled += 4;
    if (x < R){ x = 2*R - x; vx = Math.abs(vx); }
    if (x > W - R){ x = 2*(W - R) - x; vx = -Math.abs(vx); }
    if (travelled % 20 < 4) pts.push([x, y]);
    if (hits(x, y)) return { pts, end:[x, y] };
  }
  return { pts, end:null };
}
function panelBox(b){
  const P = world.panel;
  ctx.save();
  if (P.shadow){ ctx.fillStyle = 'rgba(60,45,30,.18)'; rr(ctx, b.x + 2, b.y + 3, b.w, b.h, 10); ctx.fill(); }
  ctx.fillStyle = P.bg; rr(ctx, b.x, b.y, b.w, b.h, 12); ctx.fill();
  if (P.border){ ctx.strokeStyle = P.border; ctx.lineWidth = 2; if (P.dash) ctx.setLineDash([5, 4]); rr(ctx, b.x, b.y, b.w, b.h, 12); ctx.stroke(); }
  ctx.restore();
}
function label(text, x, y, color){ ctx.fillStyle = color; ctx.font = '900 10px Nunito, ui-rounded, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(text, x, y); }
function drawPanels(){
  const P = world.panel;
  // next box with new-row dots
  panelBox(NBOX);
  label('NEXT', NX, NBOX.y + 16, P.muted);
  blitCell(next, NX, NY, .82, 1, next.frost);
  const total = D ? D.dropEvery : 8, left = Math.max(0, rowIn), gap = Math.min(9, 56 / total), x0 = NX - (total - 1)*gap/2;
  for (let i = 0; i < total; i++){ circ(ctx, x0 + i*gap, NBOX.y + NBOX.h - 10, 3, i < left ? P.accent : 'rgba(128,128,128,.3)'); }
  // twist panel
  const b = TBOX, cx = b.x + b.w/2;
  panelBox(b);
  const big = (t, y, col) => { ctx.fillStyle = col || P.accent; ctx.font = `${world.bigSize}px ${world.cfont}`; ctx.textAlign = 'center'; ctx.fillText(t, cx, y); };
  const small = (t, y) => { ctx.fillStyle = P.ink; ctx.font = '800 10px Nunito, ui-rounded, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t, cx, y); };
  if (world.twist === 'frost'){
    label('FROSTING', cx, b.y + 16, P.muted);
    blitCell({ c:1, rot:0 }, cx - 28, b.y + 44, .6, 1, true);
    ctx.fillStyle = P.accent; ctx.font = `${world.bigSize}px ${world.cfont}`; ctx.textAlign = 'left';
    ctx.fillText(next.frost ? 'next!' : `in ${frostIn}`, cx - 12, b.y + 50);
    small('paints neighbors', b.y + 74);
  } else if (world.twist === 'current'){
    const dir = drift() > 0 ? 1 : -1;
    label('CURRENT', cx, b.y + 16, P.muted);
    ctx.save(); ctx.translate(cx, b.y + 40); ctx.scale(dir, 1);
    ctx.strokeStyle = P.accent; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke(new Path2D('M-30 0 q6 -6 12 0 t12 0 t12 0 l14 0 m-7 -6 l7 6 l-7 6'));
    ctx.restore();
    small(dir > 0 ? 'drifts right' : 'drifts left', b.y + 66);
    small('flips each level', b.y + 78);
  } else if (world.twist === 'calm'){
    label('CALM MODE', cx, b.y + 16, P.muted);
    big('no game over', b.y + 44);
    small('rows float away', b.y + 66);
    small('if they get close', b.y + 78);
  } else if (world.twist === 'bloom'){
    let count = 0; for (const row of grid) for (const v of row) if (v && v.bloom) count++;
    label('FLOWERS', cx, b.y + 16, P.muted);
    blitCell({ c:0, rot:0 }, cx - 26, b.y + 42, .6, 1, true);
    ctx.fillStyle = P.accent; ctx.font = `${world.bigSize}px ${world.cfont}`; ctx.textAlign = 'left'; ctx.fillText('+50', cx - 10, b.y + 48);
    small(`${count} on the pond`, b.y + 74);
  } else if (world.twist === 'order'){
    label('ORDER', cx, b.y + 16, P.accent);
    order.forEach((o, i) => {
      const y = b.y + 34 + i*22;
      blitCell({ c:o.c, rot:0 }, b.x + 22, y, .45);
      ctx.fillStyle = P.ink; ctx.font = '900 12px Nunito, ui-rounded, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(o.n > 0 ? `${o.n} × ${SUSHI_NAMES[o.c]}` : 'done', b.x + 36, y + 4);
    });
    ctx.strokeStyle = 'rgba(120,100,80,.4)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(b.x + 10, b.y + 70); ctx.lineTo(b.x + b.w - 10, b.y + 70); ctx.stroke(); ctx.setLineDash([]);
    small('bonus +200', b.y + 80);
  }
}
function draw(){
  ctx.save();
  if (shake) ctx.translate((Math.random() - .5)*shake, (Math.random() - .5)*shake);
  ctx.drawImage(bgCanvas, -2, -2, W + 4, H + 4);
  if (worldId === 'sea'){
    for (const a of ambient){
      const x = a.x + Math.sin(clock*1.5 + a.ph)*4;
      ctx.strokeStyle = 'rgba(58,143,208,.4)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(x, a.y, a.s, 0, TAU); ctx.stroke();
      circ(ctx, x - a.s*.35, a.y - a.s*.35, a.s*.25, 'rgba(255,255,255,.9)');
    }
  } else if (worldId === 'sushi'){
    ctx.globalAlpha = .5;
    for (const a of ambient.slice(0, 7)) ell(ctx, a.x, a.y, 4, 2.6, '#f2c4cc', a.rot);
    ctx.globalAlpha = 1;
  }
  // deadline
  const danger = state === 'play' && grid.length && lowestY() > DEADLINE - ROWH*2.1 && world.twist !== 'calm';
  ctx.setLineDash([8, 8]); ctx.lineWidth = 2.5;
  ctx.strokeStyle = danger ? world.panel.accent : world.line;
  ctx.globalAlpha = danger ? .55 + .45*Math.sin(clock*8) : 1;
  ctx.beginPath(); ctx.moveTo(0, DEADLINE); ctx.lineTo(W, DEADLINE); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  // aim guide
  if (state === 'play' && !shot){
    const { pts, end } = aimPath(), A = world.aim;
    pts.forEach(([x, y], i) => {
      ctx.globalAlpha = Math.max(.15, 1 - i/pts.length) * .9;
      if (A.style === 'ring'){ ctx.strokeStyle = A.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, Math.max(2, 4.5 - i*.15), 0, TAU); ctx.stroke(); }
      else if (A.style === 'dash'){ ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(-Math.sin(aimA), Math.cos(aimA))); ctx.fillStyle = A.color; ctx.fillRect(-5, -1.5, 10, 3); ctx.restore(); }
      else circ(ctx, x, y, 3.3, A.color);
    });
    ctx.globalAlpha = 1;
    if (end){
      ctx.strokeStyle = A.color; ctx.globalAlpha = .7; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.arc(end[0], end[1], R - 2, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
  }
  // grid
  for (let r = 0; r < grid.length; r++){
    const y = cellY(r);
    for (let c = 0; c < COLS; c++){
      const v = grid[r][c];
      if (!v) continue;
      const wob = danger && r >= grid.length - 2 && !reduceMotion ? Math.sin(clock*14 + c)*1.2 : 0;
      let sx = 1, sy = 1, ox = 0, oy = 0;
      if (v.sq != null){
        const k = clock - v.sq;
        if (k >= 0 && k < .5 && !reduceMotion){ const a = .3*Math.exp(-7*k)*Math.cos(26*k); sx = 1 + a; sy = 1 - a; } else delete v.sq;
      }
      if (v.jg){
        const k = clock - v.jg.t;
        if (k >= 0 && k < .45 && !reduceMotion){ const m = 5*Math.exp(-7*k)*Math.sin(k*30); ox = v.jg.x*m; oy = v.jg.y*m; } else delete v.jg;
      }
      if (v.warn && !reduceMotion) ox += Math.sin(clock*24 + c)*1.6;
      blitCell(v, cellX(r, c) + wob + ox, y + oy, sx === 1 && sy === 1 ? 1 : [sx, sy]);
      if (v.warn){
        ctx.strokeStyle = 'rgba(255,190,40,' + (.6 + .4*Math.sin(clock*8)).toFixed(2) + ')'; ctx.lineWidth = 4; // gold, visible in every world
        ctx.beginPath(); ctx.arc(cellX(r, c) + wob + ox, y + oy, R + 1, 0, TAU); ctx.stroke();
      }
    }
  }
  if (pendingRow && grid[0]){
    ctx.globalAlpha = .55 + .45*Math.sin(clock*8); ctx.fillStyle = '#ffffff'; ctx.font = '900 22px Nunito, sans-serif'; ctx.textAlign = 'center';
    for (let c = 0; c < COLS; c += 2) ctx.fillText('›', cellX(0, c) + R, cellY(0) + 7);
    ctx.globalAlpha = 1;
  }
  for (const p of pops) if (p.t > 0) blitCell(p.cell, p.x, p.y, 1 + p.t*2, Math.max(0, 1 - p.t/.3));
  for (const f of falls){
    ctx.save(); ctx.translate(f.x, f.y); if (f.rot) ctx.rotate(f.rot);
    blitCell(f.cell, 0, 0, 1, .9*Math.max(0, f.fade == null ? 1 : f.fade));
    ctx.restore();
  }
  for (const g of rings){
    const T = g.gold ? .5 : g.small ? .25 : .35, u = Math.min(1, g.t/T);
    ctx.globalAlpha = Math.max(0, 1 - u)*.9; ctx.strokeStyle = g.gold ? '#ffc93c' : '#ffffff'; ctx.lineWidth = g.gold ? 5 : 3;
    ctx.beginPath(); ctx.arc(g.x, g.y, (g.small ? 10 : R) + u*(g.gold ? 120 : g.small ? 22 : 30), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col;
    if (p.kind){
      const z = p.size;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      if (p.kind === 'crumb') ctx.fillRect(-z/2, -z*.4, z, z*.8);
      else if (p.kind === 'drop'){ ctx.beginPath(); ctx.ellipse(0, 0, z*.42, z*.62, 0, 0, TAU); ctx.fill(); }
      else if (p.kind === 'confetti') ctx.fillRect(-z*.8, -z*.3, z*1.6, z*.6);
      else if (p.kind === 'petal'){ ctx.beginPath(); ctx.ellipse(0, 0, z*.75, z*.4, 0, 0, TAU); ctx.fill(); }
      else { ctx.beginPath(); ctx.ellipse(0, 0, z*.62, z*.32, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = '#d8d2c4'; ctx.lineWidth = .8; ctx.stroke(); }
      ctx.restore();
    }
    else if (p.heart) heart(p.x, p.y - p.size, p.size*2);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size*.6, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  if (shot) blitCell(shot, shot.x, shot.y, 1, 1, shot.frost);

  // shooter, current bubble, panels
  const L = world.launcher, bob = reduceMotion ? 0 : Math.sin(clock*2.2)*1.2;
  const rk = clock - recoilT;
  let lsx = 1, lsy = 1, loy = 0;
  if (rk >= 0 && rk < .4 && !reduceMotion){ const a = .14*Math.exp(-8*rk)*Math.cos(20*rk); lsx = 1 + a; lsy = 1 - a; loy = 6*Math.exp(-10*rk); }
  ctx.save(); ctx.translate(SX, H); ctx.scale(lsx, lsy); ctx.translate(-SX, -H + loy);
  drawShapes(ctx, L.shapes, SX - L.w/2, SY + L.dy + bob);
  ctx.restore();
  if (cur && !shot && state !== 'over') blitCell(cur, SX, SY + bob*.5, 1, 1, cur.frost);
  if (cur && next) drawPanels();

  if (combo >= 2 && state === 'play'){
    const k = clock - comboT, sc = k >= 0 && k < .35 && !reduceMotion ? 1 + .25*Math.exp(-8*k)*Math.cos(18*k) : 1;
    const txt = 'Combo ×' + Math.min(combo, 5);
    ctx.save(); ctx.translate(W/2, TOP + 22); ctx.scale(sc, sc);
    ctx.font = '20px "Righteous", Nunito, sans-serif'; ctx.textAlign = 'center';
    const bw = ctx.measureText(txt).width + 30;
    ctx.fillStyle = '#ffffff'; rr(ctx, -bw/2 - 3, -17, bw + 6, 38, 19); ctx.fill();
    ctx.fillStyle = '#d0582c'; rr(ctx, -bw/2, -11, bw, 32, 16); ctx.fill();
    ctx.fillStyle = '#ff8a5c'; rr(ctx, -bw/2, -14, bw, 30, 15); ctx.fill();
    ctx.fillStyle = '#24324a'; ctx.fillText(txt, 0, 8);
    ctx.restore();
  }
  // floating text
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  ctx.font = `20px ${world.cfont}`;
  for (const f of floats){
    if (f.t < 0) continue;
    ctx.globalAlpha = Math.max(0, 1 - f.t/1.1);
    const y = f.y - f.t*40;
    const hw = ctx.measureText(f.text).width/2 + 6, fx = Math.min(W - hw, Math.max(hw, f.x)); // keep text inside the board
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5; ctx.strokeText(f.text, fx, y);
    ctx.fillStyle = f.col || (world.panel.accent === '#9ff3e8' ? '#0f7d93' : world.panel.accent); ctx.fillText(f.text, fx, y);
  }
  ctx.globalAlpha = 1;
  // coins flying up to the Coins counter
  for (const c of coinFly){
    if (c.t < 0) continue;
    const u = Math.min(1, c.t/c.dur), e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2)/2;
    const x = (1 - e)*(1 - e)*c.x0 + 2*(1 - e)*e*c.cx + e*e*c.tx, y = (1 - e)*(1 - e)*c.y0 + 2*(1 - e)*e*c.cy + e*e*c.ty;
    const z = 8 - u*2;
    const g = ctx.createRadialGradient(x - z*.3, y - z*.35, 1, x, y, z);
    g.addColorStop(0, '#fff1a8'); g.addColorStop(.55, '#ffc93c'); g.addColorStop(1, '#e09d1a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, z, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e8a91e'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
  const fk = clock - flashT;
  if (fk >= 0 && fk < .28){ ctx.fillStyle = 'rgba(255,255,255,' + (.38*(1 - fk/.28)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
}

// ---------- loop ----------
let last = performance.now();
function frame(t){
  const dt = Math.min(.033, (t - last)/1000); last = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function snapshot(){ return { worldId, grid, parity, score, level, nColors, cur, next, state, frostIn, order, combo, rowIn, levelShots, twistShots, pendingRow }; }
try { window.claude?.hot?.snapshot?.(snapshot); } catch(e){}

// Every button press: a soft click (follows the Sound effects setting) and a tiny vibration where phones allow it.
const PRESSABLE = ".gpause, .ld-btn, .btn, .tool, .shop-buy, .shop-back, .world, .slot-main, .slot-del, .lv-node:not(:disabled), .lv-badge, .lv-play";
document.addEventListener("pointerdown", e => {
  const b = e.target.closest && e.target.closest(PRESSABLE);
  if (!b || b.disabled) return;
  audio(); tone(440, .05, "triangle", .06, 1.6);
  try { if (navigator.vibrate) navigator.vibrate(8); } catch(_){}
}, true);
function start(data){
  // A live viewer update keeps the game going; otherwise open on the main menu with Mochi Bakery behind it.
  const live = data && data.state === 'play' && Array.isArray(data.grid) && data.grid.length;
  if (live && WORLDS[data.worldId]){ worldId = data.worldId; world = WORLDS[worldId]; }
  applyWorldCss(); loadBest(); fit();
  if (live){
    ({ grid, parity, score, level, nColors, cur, next, frostIn, order } = data);
    D = difficulty(level); combo = data.combo || 0; rowIn = data.rowIn || D.dropEvery;
    levelShots = data.levelShots || 0; twistShots = data.twistShots || 0; pendingRow = !!data.pendingRow; loadBest();
    state = 'play'; overlay.hidden = true; hud();
  } else {
    setupLevel(1); hud(); state = 'menu'; showMenu();
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { queueFit(); if (state === 'pick') showPicker(); });
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
